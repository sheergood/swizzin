name: os-check
# Does swizzin (this fork) work on a Debian release? A fresh install of swizzin + nginx + panel,
# then each app, then `box update`, then a check that every service runs and answers, all in a
# throwaway Debian container with systemd. Debian 12 (supported) runs the same test as a control,
# so a failure on a newer release can be told apart from a test problem.
# Runs every Sunday (catches outside changes, like Plex moving its apt repository), before every
# upstream update is promoted (upstream-sync.yml), and from Actions → os-check → Run workflow.
# Debian 12 and 13 both must pass.
# Nothing here touches any server or branch.
on:
  schedule:
    - cron: "23 2 * * 0"   # Sundays 02:23 UTC = 07:53 IST
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps to install (space separated)"
        default: "autobrr deluge filebrowser fbquantum jellyfin prowlarr qbittorrent radarr sonarr letsencrypt"
        type: string
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      apps:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'sheergood/swizzin'
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: bookworm
            allow: "no"
          - release: trixie
            allow: "no"    # supported since sheergood-21
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: room on the test machine (compiling Deluge and qBittorrent needs several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af > /dev/null
          df -h /
      - name: Debian ${{ matrix.release }} container with systemd
        run: |
          set -e
          cat > /tmp/Dockerfile << 'EOF'
          ARG RELEASE
          FROM debian:${RELEASE}
          ENV container=docker
          RUN apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq systemd systemd-sysv dbus \
                ca-certificates curl wget git lsb-release sudo procps iproute2 cron rsyslog > /dev/null \
              && rm -f /lib/systemd/system/multi-user.target.wants/getty* \
              && systemctl mask systemd-logind.service getty.target console-getty.service
          STOPSIGNAL SIGRTMIN+3
          CMD ["/lib/systemd/systemd"]
          EOF
          docker build -q --build-arg RELEASE=${{ matrix.release }} -t swz-os-check /tmp
          docker run -d --name swz --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            --tmpfs /run --tmpfs /run/lock --hostname swz-os-check swz-os-check
          for i in $(seq 1 60); do
            s=$(docker exec swz systemctl is-system-running 2> /dev/null || true)
            case $s in running | degraded) echo "systemd: $s"; break ;; esac
            sleep 2
          done
          docker exec swz bash -c '. /etc/os-release; echo "$PRETTY_NAME"'
          # look like a normal server: Plex's package skips its service when it sees Docker, and the
          # Debian image's policy-rc.d stops packages (fail2ban, ...) from starting their services
          docker exec swz rm -f /.dockerenv /usr/sbin/policy-rc.d
          docker cp "$GITHUB_WORKSPACE" swz:/root/swizzin
          docker exec swz chown -R root:root /root/swizzin
      - name: install, upgrade and check (qBittorrent and other clients are compiled)
        run: |
          docker exec -e TERM=xterm -e APPS="${{ inputs.apps }}" -e ALLOW_RELEASE="${{ matrix.allow }}" swz bash /root/swizzin/.github/scripts/os-check.sh
      - name: results
        if: always()
        run: |
          mkdir -p results
          docker cp swz:/root/os-check.md results/os-check.md 2> /dev/null || echo "no results table" > results/os-check.md
          docker cp swz:/root/os-check-logs results/ 2> /dev/null || true
          docker cp swz:/root/logs results/swizzin-logs 2> /dev/null || true
          cat results/os-check.md >> "$GITHUB_STEP_SUMMARY"
          cat results/os-check.md
          # the end of every step's log, and of swizzin's own log, readable right here
          for f in results/os-check-logs/*.log; do
            [ -f "$f" ] || continue
            echo "::group::$(basename "$f")"; tail -n 60 "$f" | sed 's/\x1b\[[0-9;]*m//g'; echo "::endgroup::"
          done
          echo "::group::swizzin.log (last 200 lines)"; tail -n 200 results/swizzin-logs/swizzin.log 2> /dev/null | sed 's/\x1b\[[0-9;]*m//g'; echo "::endgroup::"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: os-check-${{ matrix.release }}
          path: results/
          retention-days: 14
