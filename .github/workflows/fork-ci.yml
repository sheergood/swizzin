name: fork-ci
# Catches broken scripts before a server pulls them with `box update`.
on:
  push:
  pull_request:
  workflow_call:      # used by upstream-sync.yml to test a merge before it reaches master
    inputs:
      ref:
        type: string
        required: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: file permissions (scripts 755, sources 644)
        run: ./.github/scripts/check-permissions.sh
      - name: bash syntax
        run: |
          set -e
          for f in setup.sh scripts/box scripts/nukeovh scripts/panel-smart-collect scripts/php-fpm-cli \
                   $(find scripts/install scripts/remove scripts/upgrade scripts/update scripts/nginx scripts/tests -name '*.sh') \
                   sources/functions/* sources/globals.sh; do
            bash -n "$f" || { echo "::error file=$f::bash syntax error"; exit 1; }
          done
      - name: shellcheck the fork's own scripts (errors only)
        run: |
          shellcheck -S error -x -e SC1091 sources/functions/panel scripts/panel-smart-collect scripts/panel-systemctl \
            scripts/install/panel.sh scripts/update/panel.sh scripts/upgrade/panel.sh scripts/remove/panel.sh setup.sh \
            sources/functions/fbquantum scripts/install/fbquantum.sh scripts/upgrade/fbquantum.sh \
            scripts/remove/fbquantum.sh scripts/nginx/fbquantum.sh
      - name: python collectors
        run: python3 -m py_compile scripts/panel-f2b-collect scripts/panel-host-collect scripts/panel-alert
      - name: no dangling helper references
        run: |
          missing=0
          for f in $(grep -rhoE 'sources/functions/[a-z_]+' scripts sources setup.sh | sort -u); do
            [ -e "$f" ] || { echo "::error::missing $f"; missing=1; }
          done
          exit $missing

  fbquantum:
    # runs the newest stable FileBrowser Quantum with the config swizzin writes and checks single
    # sign-on, file permissions, sharing and that it only listens on its private socket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: FileBrowser Quantum setup works end to end
        run: sudo bash .github/scripts/test-fbquantum.sh
