name: fork-ci
# Catches broken scripts before a server pulls them with `box update`.
on:
  push:
  pull_request:
  workflow_call:      # used by upstream-sync.yml to test a merge before it reaches master
    inputs:
      ref:
        type: string
        required: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 2   # the Allowed Hosts test patches the previous nginx templates too
      - name: file permissions (scripts 755, sources 644)
        run: ./.github/scripts/check-permissions.sh
      - name: bash syntax
        run: |
          set -e
          for f in setup.sh scripts/box scripts/nukeovh scripts/panel-smart-collect scripts/php-fpm-cli \
                   $(find scripts/install scripts/remove scripts/upgrade scripts/update scripts/nginx scripts/tests -name '*.sh') \
                   sources/functions/* sources/globals.sh; do
            bash -n "$f" || { echo "::error file=$f::bash syntax error"; exit 1; }
          done
      - name: shellcheck the fork's own scripts (errors only)
        run: |
          shellcheck -S error -x -e SC1091 sources/functions/panel scripts/panel-smart-collect scripts/panel-systemctl \
            scripts/install/panel.sh scripts/update/panel.sh scripts/upgrade/panel.sh scripts/remove/panel.sh setup.sh \
            sources/functions/fbquantum scripts/install/fbquantum.sh scripts/upgrade/fbquantum.sh \
            scripts/remove/fbquantum.sh scripts/nginx/fbquantum.sh
      - name: shellcheck the panel's update scripts (warnings too)
        run: shellcheck -S warning -x scripts/panel-upgrade scripts/panel-upgrade-run
      - name: python collectors
        run: python3 -m py_compile scripts/panel-f2b-collect scripts/panel-host-collect scripts/panel-updates-check
      - name: update check (all sources faked)
        run: python3 .github/scripts/test-panel-updates.py && python3 .github/scripts/test-f2b-collect.py
      - name: fail2ban web jails (config accepted, filters match only attacks)
        run: |
          sudo apt-get update -q > /dev/null && sudo apt-get install -y -q fail2ban > /dev/null
          shellcheck -S warning -x .github/scripts/test-fail2ban.sh
          sudo bash .github/scripts/test-fail2ban.sh
      - name: Servarr Allowed Hosts (templates, in-place patch, Host seen through nginx, config.xml)
        run: |
          sudo apt-get install -y -q nginx-light > /dev/null || sudo apt-get install -y -q nginx > /dev/null
          sudo systemctl stop nginx || true
          shellcheck -S warning -x sources/functions/servarr_hosts scripts/update/servarr-hosts.sh .github/scripts/test-servarr-hosts.sh
          sudo bash .github/scripts/test-servarr-hosts.sh
      - name: bare-IP rule (domains and loopback served, bare IPv4/IPv6 closed, opt-out works)
        run: |
          shellcheck -S warning -x sources/functions/bare_ip scripts/update/nginx-bare-ip.sh .github/scripts/test-bare-ip.sh
          sudo bash .github/scripts/test-bare-ip.sh
      - name: panel-systemctl refuses non-services and the units a remote server needs
        run: |
          set -u
          for u in reboot.target poweroff.target halt.target rescue.target ssh.socket a.b '../x' '-x' ''; do
            rc=0; sudo scripts/panel-systemctl start "$u" > /dev/null 2>&1 || rc=$?
            [[ $rc -eq 2 ]] || { echo "::error::panel-systemctl start '$u' exited $rc, expected 2"; exit 1; }
          done
          for u in ssh sshd.service rescue emergency.service poweroff reboot user@0 systemd-journald fail2ban nftables swizzin-upgrade-autobrr; do
            rc=0; sudo scripts/panel-systemctl stop "$u" > /dev/null 2>&1 || rc=$?
            [[ $rc -eq 3 ]] || { echo "::error::panel-systemctl stop '$u' exited $rc, expected 3"; exit 1; }
          done
          rc=0; sudo scripts/panel-systemctl mask nginx > /dev/null 2>&1 || rc=$?
          [[ $rc -eq 2 ]] || { echo "::error::action mask allowed"; exit 1; }
      - name: panel-upgrade refuses anything outside its list
        run: |
          set -u
          for a in qbittorrent rtorrent transmission sonarr lidarr 'autobrr;id' '../x' '' check2; do
            rc=0; sudo scripts/panel-upgrade "$a" > /dev/null 2>&1 || rc=$?
            [[ $rc -eq 2 ]] || { echo "::error::panel-upgrade '$a' exited $rc, expected 2"; exit 1; }
          done
          rc=0; sudo scripts/panel-upgrade autobrr extra > /dev/null 2>&1 || rc=$?
          [[ $rc -eq 2 ]] || { echo "::error::two arguments exited $rc"; exit 1; }
          rc=0; sudo scripts/panel-upgrade autobrr > /dev/null 2>&1 || rc=$?
          [[ $rc -eq 3 ]] || { echo "::error::not-installed app exited $rc, expected 3"; exit 1; }
      - name: no dangling helper references
        run: |
          missing=0
          for f in $(grep -rhoE 'sources/functions/[a-z_]+' scripts sources setup.sh | sort -u); do
            [ -e "$f" ] || { echo "::error::missing $f"; missing=1; }
          done
          exit $missing
      - name: panel-upgrade-run end to end (good upgrade, broken upgrade restores program + data, apt no-op) - keep last
        run: |
          shellcheck -S warning -x .github/scripts/test-upgrade-run.sh
          sudo bash .github/scripts/test-upgrade-run.sh

  fbquantum:
    # runs the newest stable FileBrowser Quantum with the config swizzin writes and checks single
    # sign-on, file permissions, sharing and that it only listens on its private socket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: FileBrowser Quantum setup works end to end
        env:
          GITHUB_TOKEN: ${{ github.token }}    # GitHub's anonymous API limit is shared by every job on the runner's IP
        run: sudo --preserve-env=GITHUB_TOKEN bash .github/scripts/test-fbquantum.sh
