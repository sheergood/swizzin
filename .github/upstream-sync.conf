# Rules for bringing swizzin/swizzin's changes into this fork (.github/scripts/upstream-merge.sh,
# run weekly by .github/workflows/upstream-sync.yml). See FORK.md, "Upstream updates".

# Upstream commits are taken only once they're this many days old, so the original author's own
# follow-up fixes and reverts come with them. 0 = take everything at once.
QUARANTINE_DAYS=7

# true = every upstream change waits for your approval
REVIEW_ALL=false

# Changes to these paths (regex) always wait for your approval: code that `box update` runs on
# every server, and the installer.
REVIEW_PATHS='^(scripts/box|setup\.sh|sources/|scripts/update/)'

# Apps you run. A change to any of their install/remove/upgrade/update/nginx scripts or their
# sources/functions file waits for your approval.
PROTECTED_APPS="autobrr deluge filebrowser fbquantum jellyfin plex prowlarr qbittorrent radarr sonarr panel nginx letsencrypt"

# Always waiting for approval as well, whatever the settings above: files this fork has changed,
# and apps that upstream removes (this fork keeps every app unless you decide otherwise).
